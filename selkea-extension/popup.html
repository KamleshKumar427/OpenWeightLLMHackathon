<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selkeä</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="scroll">
    <header class="top">
      <div>
        <h1>Selkeä</h1>
        <p class="sub">Make this page work for you.</p>
      </div>
      <button id="gear" class="gear" type="button" aria-label="Model settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>
        </svg>
      </button>
    </header>

    <section id="settings" class="settings" hidden aria-label="Model settings">
      <div class="field-group">
        <label class="field"><span>Preset</span>
          <select id="preset">
            <option value="">Custom</option>
            <option value="h200">Hackathon H200 · Qwen3.8-27B-FP8</option>
            <option value="a100">Hackathon A100 · Qwen3.8-27B-FP8</option>
            <option value="aitta">LUMI Aitta · Qwen3.8-27B</option>
          </select>
        </label>
        <label class="field"><span>Base URL</span>
          <input id="baseUrl" type="url" spellcheck="false" autocomplete="off">
        </label>
        <label class="field"><span>Model</span>
          <input id="model" type="text" spellcheck="false" autocomplete="off">
        </label>
        <label class="field"><span>API key</span>
          <input id="apiKey" type="password" spellcheck="false" autocomplete="off" placeholder="Stored only in this browser">
        </label>
        <label class="row">
          <span class="row-label">Skip the model's thinking phase</span>
          <input id="noThink" class="switch" type="checkbox" role="switch">
        </label>
      </div>
      <div class="btn-row">
        <button id="testBtn" class="btn secondary" type="button">Test connection</button>
        <button id="saveBtn" class="btn secondary" type="button">Save</button>
      </div>
      <p id="settingsMsg" class="note" role="status"></p>
    </section>

    <main>
      <h2 class="section" id="h-who">Who is this for</h2>
      <div id="profiles" class="grid" role="group" aria-labelledby="h-who"></div>

      <h2 class="section" id="h-what">What should change</h2>
      <div id="options"></div>

      <h2 class="section" id="h-strength">Strength</h2>
      <div id="intensity" class="seg" role="radiogroup" aria-labelledby="h-strength"></div>

      <h2 class="section" id="h-else">Anything else</h2>
      <div class="list">
        <label class="sr-only" for="custom">Describe what you need in your own words</label>
        <textarea id="custom" rows="3" maxlength="1500"
          placeholder="Bright backgrounds give me headaches, and I need much bigger buttons. Keep it in Finnish."></textarea>
      </div>
    </main>
  </div>

  <footer class="dock">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="btn-row">
      <button id="go" class="btn primary" type="button">Make this page accessible</button>
      <button id="undo" class="btn secondary" type="button">Undo</button>
    </div>
    <p id="count" class="count"></p>
  </footer>

  <script src="catalog.js"></script>
  <script src="popup.js"></script>
</body>
</html>
